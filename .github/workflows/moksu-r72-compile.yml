name: moksu R7.2 Android and Rust verification
on:
  push:
    branches: [moksu-331-r72-20261014]
    paths:
      - 'moksu/r72/moksu-v3.3.1-R7.2-source.patch'
      - '.github/workflows/moksu-r72-compile.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-r72-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Apply final R7.2 patch on verified R7.1 source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-r71-hotfix-source
          path: input
          run-id: 38508997318
          github-token: ${{ github.token }}
      - name: Verify exact reviewed patch and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test -s input/moksu-r71-hotfix-source.tar.gz
          tar -xzf input/moksu-r71-hotfix-source.tar.gz -C source
          cd source
          git apply --check ../config/moksu/r72/moksu-v3.3.1-R7.2-source.patch
          git apply ../config/moksu/r72/moksu-v3.3.1-R7.2-source.patch
          node --check userspace/ksud/assets/webadmin/app.js
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('manager/app/src/main')
          ET.parse(root/'AndroidManifest.xml')
          ET.parse(root/'res/values/strings.xml')
          code=(root/'java/me/weishu/kernelsu/ui/screen/home/HomeUiState.kt').read_text()
          assert 'customManagerBuild' in code
          assert 'showLkmUpdate' in code and 'hasUpdate' in code
          patch=(root/'java/me/weishu/kernelsu/mok/MokFlashPermit.kt').read_text()
          assert 'object MokFlashPermit' in patch
          PY
          cd ..
          cp -a config/moksu source/moksu-build
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=.cxx -czf out/moksu-r72-source.tar.gz -C source .
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r72-source, path: out/, retention-days: 14, if-no-files-found: warn}
  android:
    name: Compile R7.2 manager (unsigned)
    runs-on: ubuntu-24.04
    needs: source
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r72-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r72-source.tar.gz -C source
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile unsigned APK preserving existing manager version
        working-directory: source/manager
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.2-R7.1 -PKSU_VERSION_CODE=32681 2>&1 | tee "$GITHUB_WORKSPACE/out/gradle-R72.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/moksu-r72-manager-unsigned.apk"
          test -s "$GITHUB_WORKSPACE/out/moksu-r72-manager-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/moksu-r72-manager-unsigned.apk" > "$GITHUB_WORKSPACE/out/android-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r72-android, path: out/, retention-days: 14, if-no-files-found: warn}
  rust:
    name: Compile R7.2 ksud userspace
    runs-on: ubuntu-24.04
    needs: source
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r72-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r72-source.tar.gz -C source
      - uses: actions/download-artifact@v4
        with:
          pattern: moksu-redesign-kmi-*
          path: lkms
          merge-multiple: true
          run-id: 38418012975
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - name: Install Rust Android toolchains
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build Android ksud for both architectures
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash config/moksu/ksu331/build_userspace.sh 2>&1 | tee out/rust-R72.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r72-native, path: out/, retention-days: 14, if-no-files-found: warn}
