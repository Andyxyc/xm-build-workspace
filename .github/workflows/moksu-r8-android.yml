name: moksu R8 Calculator and Calendar Android
on:
  push:
    branches: [moksu-331-r8-20261014]
    paths:
      - '.github/workflows/moksu-r8-android.yml'
      - 'moksu/r8/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-r8-calculator-calendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-r6-hotfix-source
          path: input
          run-id: 38474797803
          github-token: ${{ github.token }}
      - name: Apply R8 to exact, successful R6 hotfix source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test -s input/moksu-r6-hotfix-source.tar.gz
          tar -xzf input/moksu-r6-hotfix-source.tar.gz -C source
          cd source
          git apply --check ../config/moksu/r8/moksu-R8-calculator-calendar.patch
          git apply ../config/moksu/r8/moksu-R8-calculator-calendar.patch
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('manager/app/src/main')
          ET.parse(root/'AndroidManifest.xml')
          mok=root/'java/me/weishu/kernelsu/mok'
          for name in ('MokCalculatorApp.kt','MokCalendarApp.kt','MokCalendarData.kt'):
              assert (mok/name).stat().st_size>3000
          assert 'setPinLength(' not in (mok/'MokDisguise.kt').read_text()
          assert 'MokAgendaReminderReceiver' in (root/'AndroidManifest.xml').read_text()
          PY
          cd ..
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=.cxx -czf out/moksu-r8-source.tar.gz -C source .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r8-source
          path: out/
          retention-days: 14
          if-no-files-found: warn
  android:
    runs-on: ubuntu-24.04
    needs: source
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r8-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r8-source.tar.gz -C source
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile Android release manager without private signing keys
        working-directory: source/manager
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.1-R8 2>&1 | tee "$GITHUB_WORKSPACE/out/gradle-R8.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/moksu-r8-manager-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/moksu-r8-manager-unsigned.apk" > "$GITHUB_WORKSPACE/out/moksu-r8.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r8-android-compile
          path: out/
          retention-days: 14
          if-no-files-found: warn