name: moksu R5 Rust UTF8 fixed native build
on:
  push:
    branches: [moksu-331-r5-20261014]
    paths:
      - 'moksu/r5/**'
      - '.github/workflows/moksu-r5-rust-hotfix.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-r5-rust-hotfix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Apply R5 on verified R4 source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-r4-source
          path: input
          run-id: 38452941842
          github-token: ${{ github.token }}
      - name: Apply R5 patch on previous tested code and validate guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test -s input/moksu-r4-source.tar.gz
          tar -xzf input/moksu-r4-source.tar.gz -C source
          cd source
          git apply --check ../config/moksu/r5/moksu-v3.3.1-R5.patch
          git apply ../config/moksu/r5/moksu-v3.3.1-R5.patch
          git apply --check ../config/moksu/r5/r5-rust-utf8-fix.patch
          git apply ../config/moksu/r5/r5-rust-utf8-fix.patch
          node --check userspace/ksud/assets/webadmin/app.js
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=Path('manager/app/src/main')
          for p in [r/'AndroidManifest.xml',r/'res/values/strings.xml',r/'res/drawable/mok_calc_icon.xml',r/'res/drawable/mok_calendar_icon.xml']:
              ET.parse(p)
          from pathlib import Path
          root=Path('manager/app/src/main')
          manifest=(root/'AndroidManifest.xml').read_text()
          ui=(root/'java/me/weishu/kernelsu/mok/MokDisguise.kt').read_text()
          permit=(root/'java/me/weishu/kernelsu/mok/MokFlashPermit.kt').read_text()
          web=Path('userspace/ksud/assets/webadmin/app.js').read_text()
          assert 'MokCalculatorLauncher' in manifest and 'MokCalendarLauncher' in manifest
          assert 'object MokDisguise' in ui and 'CalculatorFace' in ui and 'CalendarFace' in ui
          assert 'object MokFlashPermit' in permit and 'moksu_flash_verify_cert' in permit
          assert (root/'res/raw/moksu_flash_verify_cert.der').stat().st_size > 500
          assert 'MokDeviceCode' in (root/'java/me/weishu/kernelsu/mok/MokDeviceCode.kt').read_text()
          assert '未识别' not in web or 'pkg' in web
          PY
          cd ..
          cp -a config/moksu source/moksu-build
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=.cxx -czf out/moksu-r5-utf8-source.tar.gz -C source .
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r5-utf8-source, path: out/, retention-days: 14, if-no-files-found: warn}
  rust:
    name: Rust R5 ksud native compile
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r5-utf8-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r5-utf8-source.tar.gz -C source
      - uses: actions/download-artifact@v4
        with:
          pattern: moksu-redesign-kmi-*
          path: lkms
          merge-multiple: true
          run-id: 38418012975
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - name: Install Android Rust toolchains
        run: |
          set -euo pipefail
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build ksud and ksuinit for both architectures
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash config/moksu/ksu331/build_userspace.sh 2>&1 | tee out/rust-R5.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r5-utf8-native, path: out/, retention-days: 14, if-no-files-found: warn}
