name: Moksu 3.3.1 migration audit
on:
  push:
    branches: [moksu-ksu331-6ee3e003]
    paths: ['.github/workflows/moksu331-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hartgerinktarcila-design/7kimisu
          ref: 0246ca0f16ea2e3a6af030643bb6f74262e0e26c
          path: old
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          path: new
          persist-credentials: false
      - name: Compare and report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib,hashlib,re
          src1=Path('old/manager/app/src/main/java/com/sevenk/core')
          src2=Path('new/manager/app/src/main/java/me/weishu/kernelsu')
          a={p.relative_to(src1).as_posix():p for p in src1.rglob('*') if p.is_file()}
          b={p.relative_to(src2).as_posix():p for p in src2.rglob('*') if p.is_file()}
          print('old-only files',len(a.keys()-b.keys()))
          for x in sorted(a.keys()-b.keys())[:100]:print('OLDONLY',x)
          print('new-only files',len(b.keys()-a.keys()))
          for x in sorted(b.keys()-a.keys())[:100]:print('NEWONLY',x)
          print('shared file count',len(a.keys()&b.keys()))
          core=['Natives.kt','KernelSUApplication.kt','ui/MainActivity.kt','ui/webui/WebUIActivity.kt','ui/screen/home/HomeMaterial.kt','ui/screen/home/HomeMiuix.kt','ui/screen/settings/SettingsMaterial.kt','ui/screen/module/ModuleViewModel.kt','ui/UiMode.kt']
          for x in core:
            if x not in a or x not in b:continue
            s=a[x].read_text(errors='replace').replace('com.sevenk.core','me.weishu.kernelsu').splitlines()
            t=b[x].read_text(errors='replace').splitlines()
            sm=difflib.SequenceMatcher(None,s,t,autojunk=False)
            same=sum(e-s1 for tag,s1,e,_,_ in sm.get_opcodes() if tag=='equal')
            print('COMPARE',x,'old',len(s),'new',len(t),'identical_lines',same,'ratio',round(sm.ratio(),3))
          for x in ['kernel/Kbuild','userspace/ksud/Cargo.toml','userspace/ksuinit/Cargo.toml','manager/app/build.gradle.kts','uapi/ksu.h']:
            op=Path('old')/x; np=Path('new')/x
            if op.exists() and np.exists():
              s=op.read_text(errors='replace').replace('com.sevenk.core','me.weishu.kernelsu').splitlines()
              t=np.read_text(errors='replace').splitlines()
              sm=difflib.SequenceMatcher(None,s,t,autojunk=False)
              print('COMPARE',x,'old',len(s),'new',len(t),'ratio',round(sm.ratio(),3))
          PY
