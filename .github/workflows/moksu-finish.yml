name: Finish moksu APK
on:
  push:
    branches: [moksu-r2-6ee3e003]
    paths: ['.github/workflows/moksu-finish.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-finish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manager:
    name: Compile Android manager
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hartgerinktarcila-design/7kimisu
          ref: 0246ca0f16ea2e3a6af030643bb6f74262e0e26c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Apply pinned source changes
        run: |
          python3 config/moksu/apply_ci.py source
          mkdir -p out
          cp -a config/moksu source/moksu-build
          tar --exclude=.git -czf out/moksu-corresponding-source.tar.gz -C source .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 16111833
          log-accepted-android-sdk-licenses: false
      - name: Install exact Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile manager
        shell: bash
        working-directory: source/manager
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=2.29.2 2>&1 | tee "$GITHUB_WORKSPACE/out/gradle-build.log"
          python3 - <<'PY'
          import pathlib, shutil, os, zipfile
          matches=list(pathlib.Path('app/build/outputs/apk/release').glob('*.apk'))
          assert len(matches)==1, matches
          with zipfile.ZipFile(matches[0]) as z:
            assert z.testzip() is None
            assert 'classes.dex' in z.namelist()
          shutil.copy2(matches[0],pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'out/manager-unsigned.apk')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-manager-build
          path: out/
          if-no-files-found: error
          retention-days: 14
  userspace:
    name: Compile root userspace
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hartgerinktarcila-design/7kimisu
          ref: 0246ca0f16ea2e3a6af030643bb6f74262e0e26c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - run: python3 config/moksu/apply_ci.py source
      - name: Validate existing kernel build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, json, os, time
          url='https://api.github.com/repos/Andyxyc/xm-build-workspace/actions/runs/38264765534'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'moksu-build'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:
              return json.load(r)
          run=get(url)
          assert run['head_sha']=='e610ee6f43ff55c54f871a8b5d61b212d6c890a7'
          expected={'LKM '+k for k in ['android12-5.10','android13-5.10','android13-5.15','android14-5.15','android14-6.1','android15-6.6','android16-6.12','android17-6.18']}
          deadline=time.monotonic()+1200
          while True:
            jobs=[j for j in get(url+'/jobs?per_page=100')['jobs'] if j['name'] in expected]
            assert {j['name'] for j in jobs}==expected,'Missing expected kernel jobs'
            failed=[j['name'] for j in jobs if j['status']=='completed' and j['conclusion']!='success']
            if failed: raise RuntimeError('Kernel build failed: '+str(failed))
            complete=sum(j['conclusion']=='success' for j in jobs)
            print('Verified kernel jobs:',complete,'/ 8',flush=True)
            if complete==8:break
            if time.monotonic()>deadline:raise TimeoutError('Kernel build still incomplete')
            time.sleep(30)
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: moksu-lkm-*
          path: lkms
          merge-multiple: true
          run-id: 38264765534
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 16111833
          log-accepted-android-sdk-licenses: false
      - name: Native dependencies
        run: |
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup target add aarch64-linux-android x86_64-linux-android
          git config --global url."https://github.com/cocool97/adb_client".insteadOf "https://github.com/Kernel-SU/adb_client"
      - name: Compile ksuinit and ksud
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          mkdir -p out
          bash config/moksu/build_userspace.sh 2>&1 | tee out/native-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-userspace-build
          path: out/
          if-no-files-found: error
          retention-days: 14
  package:
    name: Assemble complete APK
    needs: [manager, userspace]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-manager-build
          path: ui
      - uses: actions/download-artifact@v4
        with:
          name: moksu-userspace-build
          path: native
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 16111833
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;37.0.0'
      - name: Pack and validate
        run: python3 config/moksu/pack_unsigned.py
      - uses: actions/upload-artifact@v4
        with:
          name: moksu-complete-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 14
