name: moksu official 3.3.1 core preview
on:
  push:
    branches: [moksu-ksu331-6ee3e003]
    paths:
      - 'moksu/ksu331/apply_core.py'
      - 'moksu/overlay/**'
      - '.github/workflows/moksu331-manager.yml'
permissions:
  contents: read
concurrency:
  group: moksu331-manager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: Compile official KernelSU 3.3.1 moksu manager
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Apply moksu front-end login to genuine 3.3.1 source
        run: |
          set -euo pipefail
          python3 -m py_compile config/moksu/ksu331/apply_core.py
          python3 config/moksu/ksu331/apply_core.py source config
          mkdir -p out
          tar --exclude=.git --exclude=.gradle --exclude=build -czf out/moksu331-core-preview-source.tar.gz -C source .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 16111833
          log-accepted-android-sdk-licenses: false
      - name: Install required exact tools
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile manager
        working-directory: source/manager
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.1 2>&1 | tee "$GITHUB_WORKSPACE/out/moksu331-gradle.log"
          python3 - <<'PY'
          import pathlib,zipfile,shutil,os,hashlib
          paths=list(pathlib.Path('app/build/outputs/apk/release').glob('*.apk'))
          assert len(paths)==1,paths
          apk=paths[0]
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert "classes.dex" in z.namelist()
          dest=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"out/moksu331-manager-unsigned.apk"
          shutil.copyfile(apk,dest)
          print("APK_PREVIEW",dest.name,dest.stat().st_size,hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu331-manager-preview
          path: out/
          if-no-files-found: error
          retention-days: 14
