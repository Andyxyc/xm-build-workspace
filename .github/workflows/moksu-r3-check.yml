name: moksu v3.3.1 R3 compile validation
on:
  push:
    branches: [moksu-331-r3-20261014]
    paths:
      - '.github/workflows/moksu-r3-check.yml'
      - 'moksu/r3/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-r3-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Apply R2 + R3 patches to pinned KernelSU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-redesign-source
          path: input
          run-id: 38418472725
          github-token: ${{ github.token }}
      - name: Apply and validate exact R2 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test -s input/moksu-redesign-source.tar.gz
          tar -xzf input/moksu-redesign-source.tar.gz -C source
          cd source
          git apply --check ../config/moksu/r2/moksu-v3.3.1-R2.patch
          git apply ../config/moksu/r2/moksu-v3.3.1-R2.patch
          git apply --check ../config/moksu/r3/r3-source.patch
          git apply ../config/moksu/r3/r3-source.patch
          ! grep -q 'MokRecoveryActivity::class.java' manager/app/src/main/java/me/weishu/kernelsu/ui/screen/home/HomeMaterial.kt
          ! grep -q 'MokRecoveryActivity::class.java' manager/app/src/main/java/me/weishu/kernelsu/ui/screen/home/HomeMiuix.kt
          grep -q 'if (hiddenMode) return@buildList' manager/app/src/main/java/me/weishu/kernelsu/ui/screen/install/InstallScreen.kt
          grep -q 'method.uri == null' manager/app/src/main/java/me/weishu/kernelsu/ui/screen/install/InstallScreen.kt
          node --check userspace/ksud/assets/webadmin/app.js
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for f in ["manager/app/src/main/AndroidManifest.xml", "manager/app/src/main/res/values/strings.xml", "manager/app/src/main/res/xml/moksu_browser_auto_service.xml"]:
              ET.parse(f)
          PY
          cd ..
          cp -a config/moksu source/moksu-build
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=.cxx -czf out/moksu-r3-source.tar.gz -C source .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r3-source
          path: out/
          retention-days: 14
          if-no-files-found: warn

  android:
    name: Android Kotlin Gradle build (unsigned only)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with: {name: moksu-r3-source, path: input}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - run: mkdir -p out && tar -xzf input/moksu-r3-source.tar.gz -C source
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Assemble R3 unsigned manager
        shell: bash
        working-directory: source/manager
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.1 2>&1 | tee "$GITHUB_WORKSPACE/out/gradle-R3.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/moksu-r3-manager-unsigned.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r3-android-compile
          path: out/
          retention-days: 14
          if-no-files-found: warn

  rust:
    name: Rust ksud native build (no signing)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: moksu-r3-source, path: input}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - run: mkdir -p out && tar -xzf input/moksu-r3-source.tar.gz -C source
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: moksu-redesign-kmi-*
          path: lkms
          merge-multiple: true
          run-id: 38418012975
          github-token: ${{ github.token }}
      - name: Rust Android NDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update && sudo apt-get install -y libclang-dev
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Compile R3 Rust daemon
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash config/moksu/ksu331/build_userspace.sh 2>&1 | tee out/rust-R3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r3-rust-compile
          path: out/
          retention-days: 14
          if-no-files-found: warn
