name: moksu v3.3.1 R6 compile gate
on:
  push:
    branches: [moksu-331-r6-20261014]
    paths:
      - 'moksu/r6/**'
      - '.github/workflows/moksu-r6-compile.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-r6-20261014-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Apply R6 onto successful R5 UTF8 source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-r5-utf8-source
          path: input
          run-id: 38470134597
          github-token: ${{ github.token }}
      - name: Apply R6 fixes with exact baseline check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test -s input/moksu-r5-utf8-source.tar.gz
          tar -xzf input/moksu-r5-utf8-source.tar.gz -C source
          cd source
          git apply --check ../config/moksu/r6/moksu-v3.3.1-R6-20261014.patch
          git apply ../config/moksu/r6/moksu-v3.3.1-R6-20261014.patch
          node --check userspace/ksud/assets/webadmin/app.js
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=Path('manager/app/src/main')
          for p in [r/'AndroidManifest.xml',r/'res/values/strings.xml',r/'res/drawable/mok_calc_icon.xml',r/'res/drawable/mok_calendar_icon.xml']:
              ET.parse(p)
          from pathlib import Path
          root=Path('manager/app/src/main')
          manifest=(root/'AndroidManifest.xml').read_text()
          ui=(root/'java/me/weishu/kernelsu/mok/MokDisguise.kt').read_text()
          permit=(root/'java/me/weishu/kernelsu/mok/MokFlashPermit.kt').read_text()
          web=Path('userspace/ksud/assets/webadmin/app.js').read_text()
          assert 'MokCalculatorLauncher' in manifest and 'MokCalendarLauncher' in manifest
          assert 'object MokDisguise' in ui and 'CalculatorFace' in ui and 'CalendarFace' in ui
          assert 'object MokFlashPermit' in permit and 'moksu_flash_verify_cert' in permit
          assert (root/'res/raw/moksu_flash_verify_cert.der').stat().st_size > 500
          assert 'MokDeviceCode' in (root/'java/me/weishu/kernelsu/mok/MokDeviceCode.kt').read_text()
          assert '未识别' not in web or 'pkg' in web
          assert 'MokWebRecovery.disableStealth()' in ui and 'sixDigits' in ui
          assert 'LocalAgendaStore' in ui and 'onUnlock(display)' in ui
          assert (root/'java/me/weishu/kernelsu/mok/MokWebRecovery.kt').is_file()
          PY
          cd ..
          cp -a config/moksu source/moksu-build
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=.cxx -czf out/moksu-r6-source.tar.gz -C source .
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r6-source, path: out/, retention-days: 14, if-no-files-found: warn}
  android:
    name: Android R6 manager unsigned compile
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r6-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r6-source.tar.gz -C source
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile the original upstream Compose UI with R6 changes
        shell: bash
        working-directory: source/manager
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.1-R6 2>&1 | tee "$GITHUB_WORKSPACE/out/gradle-R6.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/moksu-r6-manager-unsigned.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r6-android, path: out/, retention-days: 14, if-no-files-found: warn}
  rust:
    name: Rust R6 ksud native compile
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r6-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r6-source.tar.gz -C source
      - uses: actions/download-artifact@v4
        with:
          pattern: moksu-redesign-kmi-*
          path: lkms
          merge-multiple: true
          run-id: 38418012975
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - name: Install Android Rust toolchains
        run: |
          set -euo pipefail
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build ksud and ksuinit for both architectures
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash config/moksu/ksu331/build_userspace.sh 2>&1 | tee out/rust-R6.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moksu-r6-native, path: out/, retention-days: 14, if-no-files-found: warn}
