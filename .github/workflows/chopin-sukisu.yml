name: Chopin Android 13 SukiSU SUSFS KPM compile trial

on:
  push:
    branches:
      - chopin-sukisu-20261025
    paths:
      - ".github/workflows/chopin-sukisu.yml"
      - "chopin/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chopin-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: config/chopin.env
      KBUILD_BUILD_USER: xiaomo
      KBUILD_BUILD_HOST: chopin-builder
      BASELINE_REFERENCE_RUN: "40131456192"
    steps:
      - name: Checkout isolated chopin branch
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make build-essential git git-lfs python3 python-is-python3 \
            curl wget unzip zip cpio device-tree-compiler libssl-dev libelf-dev \
            libncurses-dev lz4 zstd ccache rsync ca-certificates \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libc6-dev-arm64-cross
          mkdir -p "$WORKSPACE"
          mkdir -p build-logs release-evidence

      - name: Fetch existing non-GKI build framework (pinned)
        run: |
          git clone --depth=1 https://github.com/Owen0225/sukisu-Ultra-4.14.-.git builder
          test "$(git -C builder rev-parse HEAD)" = 3a0956434309958a96ca3f701cad7d7c5af0a83b
          mkdir -p builder/config
          cp chopin/target.env builder/config/chopin.env
          echo "Builder: $(git -C builder rev-parse HEAD)"

      - name: Resolve build profile
        working-directory: builder
        run: bash scripts/config.sh

      - name: Prepare compiler and cross-toolchain
        working-directory: builder
        run: bash scripts/toolchain.sh

      - name: Fetch matching chopin vendor source
        working-directory: builder
        run: |
          bash scripts/source.sh
          actual="$(git -C "$WORKSPACE/android-kernel" rev-parse HEAD)"
          echo "Vendor kernel SHA: $actual"
          test "$actual" = "0647a49c9557faa92b90c4ae188587787226be9e"

      - name: Compile unmodified vendor baseline before root integration
        working-directory: builder
        run: |
          set -o pipefail
          if test -n "$BASELINE_REFERENCE_RUN" && test "$BASELINE_REFERENCE_RUN" != "$GITHUB_RUN_ID"; then
            python3 ../chopin/wait_baseline.py "$BASELINE_REFERENCE_RUN"
            exit 0
          fi
          /usr/bin/time -v bash scripts/build.sh compile 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/vendor-baseline.log"
          cp "$WORKSPACE/android-kernel/out/.config" "$GITHUB_WORKSPACE/release-evidence/vendor-baseline.config"
          cp "$WORKSPACE/android-kernel/out/Module.symvers" "$GITHUB_WORKSPACE/release-evidence/vendor-baseline.Module.symvers"
          sha256sum "$WORKSPACE/android-kernel/out/arch/arm64/boot/Image" > "$GITHUB_WORKSPACE/release-evidence/vendor-baseline-image.sha256"

      - name: Integrate latest verified SukiSU builtin
        working-directory: builder
        run: |
          bash scripts/kernelsu.sh
          actual="$(git -C "$WORKSPACE/android-kernel/KernelSU" rev-parse HEAD)"
          echo "SukiSU builtin SHA: $actual"
          test "$actual" = "ce75122bec7423e0f1fa06e3e9a174085c5231ab"

      - name: Port SUSFS 1.5.5 and old-kernel interfaces
        working-directory: builder
        run: |
          # The stock 4.14 readdir.c diverges from generic SUSFS and cannot be fuzz-patched.
          # Apply five function-scoped hooks, preserving all other SUSFS source patches.
          python3 -m py_compile ../chopin/port_hooks.py ../chopin/port_readdir.py
          python3 - <<'PY'
          from pathlib import Path
          f = Path('scripts/patches.sh')
          s = f.read_text()
          target = '( cd "$KERNEL_DIR" && apply_patch "$kernel_patch" 1 )'
          assert s.count(target)==1, 'SUSFS builder changed'
          prefix = 'python3 "${GITHUB_WORKSPACE}/chopin/port_readdir.py" "$kernel_patch" "$KERNEL_DIR"\n\t'
          f.write_text(s.replace(target, prefix + target, 1))
          PY
          if ! bash scripts/patches.sh all; then
            echo "::error::SUSFS vendor patch rejected; listing all exact failed hunks"
            patchfile="$WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch"
            (cd "$WORKSPACE/android-kernel" && patch -p1 --batch --dry-run --fuzz=3 < "$patchfile") 2>&1 | tee "$GITHUB_WORKSPACE/susfs-hunk-diagnostics.txt" || true
            exit 44
          fi
          actual="$(git -C "$WORKSPACE/susfs4ksu" rev-parse HEAD)"
          echo "SUSFS 4.14 SHA: $actual"
          test "$actual" = "d18028f2a8f3ba16a907bff0edc16376cf38e2bf"
          python3 ../chopin/port_hooks.py "$WORKSPACE/android-kernel"
          python3 ../chopin/port_414_compat.py "$WORKSPACE/android-kernel"
          python3 ../chopin/port_414_optional.py "$WORKSPACE/android-kernel"
          python3 ../chopin/port_susfs155.py "$WORKSPACE/android-kernel" "$WORKSPACE/susfs4ksu"
          grep -n "static_call.h" "$WORKSPACE/android-kernel/KernelSU/kernel/kernel_includes.h"
          grep -n "IN_ALL_EVENTS" "$WORKSPACE/android-kernel/fs/notify/fdinfo.c"
          # Normalize whitespace on SUSFS patch-added lines ONLY; do not alter vendor files globally.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, os
          root=Path(os.environ["WORKSPACE"])/"android-kernel"
          p=subprocess.run(["git","-C",str(root),"diff","--check"],capture_output=True,text=True)
          for row in p.stdout.splitlines():
              if row.startswith("+"):  # git diff --check prints the offending content after its location
                  continue
              m=re.match(r"^(.+?):(\d+): trailing whitespace\.$",row)
              if not m:
                  raise SystemExit("Unhandled diff check: "+row)
              name,num=m.group(1),int(m.group(2))
              file=root/name
              lines=file.read_text().splitlines(keepends=True)
              original=lines[num-1]
              clean=original.rstrip(" \t\r\n")+"\n"
              assert clean!=original
              lines[num-1]=clean
              file.write_text("".join(lines))
              print("Fixed upstream patch trailing whitespace:",name,num)
          PY
          git -C "$WORKSPACE/android-kernel" diff --check
          echo "4.14 SUSFS / manual syscall ports integrated"

      - name: Build source tree using chopin defconfig
        working-directory: builder
        run: |
          set -o pipefail
          bash scripts/build.sh defconfig
          /usr/bin/time -v bash scripts/build.sh compile 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/ported-kernel.log"

      - name: Check vendor camera and root features
        run: |
          python3 chopin/verify_config.py "$WORKSPACE/android-kernel/out/.config"
          test -f "$WORKSPACE/android-kernel/out/arch/arm64/boot/Image"
          printf "SukiSU builtin + SUSFS + KPM config exists; this does not verify camera on device.\n"

      - name: Apply KPM to compiled arm64 Image
        working-directory: builder
        run: |
          set -o pipefail
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git "$WORKSPACE/SukiSU_patch"
          test "$(git -C "$WORKSPACE/SukiSU_patch" rev-parse HEAD)" = 7c6289c95bdc786119b03d150236853b7b4872ca
          echo "489e9daa31d468659e4593b11a22b9ea2ac7edb268b2e965610f0d28d4d30cb1  $WORKSPACE/SukiSU_patch/kpm/patch_linux" | sha256sum -c -
          cp "$WORKSPACE/android-kernel/out/arch/arm64/boot/Image" "$WORKSPACE/Image.before-kpm"
          bash scripts/build.sh check 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/kpm-postprocess.log"
          ! cmp -s "$WORKSPACE/Image.before-kpm" "$WORKSPACE/android-kernel/out/arch/arm64/boot/Image"
          sha256sum "$WORKSPACE/Image.before-kpm" > "$GITHUB_WORKSPACE/release-evidence/Image.before-kpm.sha256"
          sha256sum "$WORKSPACE/android-kernel/out/arch/arm64/boot/Image"
          git -C "$WORKSPACE/android-kernel" status --short | head -80

      - name: Build matching native ARM64 SUSFS 1.5.5 client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['WORKSPACE'])/'susfs4ksu/ksu_susfs/jni/main.c'
          s=p.read_text().replace('#include <android/log.h>', '/* No Android log API is used by this CLI. */')
          assert s.count('bool                    is_statically;') == 1
          s=s.replace('bool                    is_statically;', 'int                     is_statically;',1)
          Path('release-evidence/ksu_susfs_155.c').write_text(s)
          PY
          aarch64-linux-gnu-gcc -O2 -static release-evidence/ksu_susfs_155.c -o release-evidence/ksu_susfs_155
          aarch64-linux-gnu-readelf -h release-evidence/ksu_susfs_155 > release-evidence/ksu_susfs_155.elf-header.txt

      - name: Save evidence of source and kernel version
        run: |
          mkdir -p release-evidence
          cp "$WORKSPACE/android-kernel/out/.config" release-evidence/chopin-built.config
          cp "$WORKSPACE/android-kernel/out/include/generated/utsrelease.h" release-evidence/utsrelease.h
          cp "$WORKSPACE/android-kernel/out/Module.symvers" release-evidence/ported.Module.symvers
          cp "$WORKSPACE/android-kernel/out/System.map" release-evidence/System.map
          git -C "$WORKSPACE/android-kernel" diff --binary > release-evidence/vendor-changes.patch
          git -C "$WORKSPACE/android-kernel/KernelSU" diff --binary > release-evidence/SukiSU-changes.patch
          cp "$WORKSPACE/android-kernel/KernelSU/kernel/chopin_susfs155_prctl.c" release-evidence/
          "$WORKSPACE/clang/bin/clang" --version > release-evidence/clang-version.txt
          git -C "$WORKSPACE/clang" rev-parse HEAD > release-evidence/clang-commit.txt
          {
            echo "status=compiled_only; NOT FLASHABLE; NO HARDWARE OR CAMERA VALIDATION"
            echo "vendor=$(git -C "$WORKSPACE/android-kernel" rev-parse HEAD)"
            echo "sukisu=$(git -C "$WORKSPACE/android-kernel/KernelSU" rev-parse HEAD)"
            echo "susfs=$(git -C "$WORKSPACE/susfs4ksu" rev-parse HEAD)"
            sha256sum "$WORKSPACE/android-kernel/out/arch/arm64/boot/Image"
          } > release-evidence/BUILD-STATUS.txt

      - name: Upload compiled raw Image candidate (not a flash ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: chopin-sukisu-susfs-kpm-raw-build-candidate
          path: |
            kernel_workspace/android-kernel/out/arch/arm64/boot/Image
            release-evidence/*
            build-logs/*
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnostic configuration and patches even after a failure
        if: always()
        run: |
          mkdir -p build-logs/diagnostics
          for f in .config include/generated/utsrelease.h Module.symvers; do
            if test -f "$WORKSPACE/android-kernel/out/$f"; then
              cp "$WORKSPACE/android-kernel/out/$f" "build-logs/diagnostics/$(basename "$f")"
            fi
          done
          if test -d "$WORKSPACE/android-kernel/.git"; then
            git -C "$WORKSPACE/android-kernel" diff --binary > build-logs/diagnostics/vendor.patch
          fi
          if test -d "$WORKSPACE/android-kernel/KernelSU/.git"; then
            git -C "$WORKSPACE/android-kernel/KernelSU" diff --binary > build-logs/diagnostics/SukiSU.patch
          fi

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chopin-failure-diagnostics
          path: |
            susfs-hunk-diagnostics.txt
            kernel_workspace/android-kernel/out/.config
            kernel_workspace/android-kernel/out/.tmp_versions
            kernel_workspace/android-kernel/out/include/generated/utsrelease.h
            build-logs/**
            release-evidence/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
