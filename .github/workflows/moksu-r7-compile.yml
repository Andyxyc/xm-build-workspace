name: moksu v3.3.1 R7 Android and Rust compile
on:
  push:
    branches: [moksu-331-r7-20261014]
    paths:
      - '.github/workflows/moksu-r7-compile.yml'
      - 'moksu/r7/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-r7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Apply R7 to verified R6 source
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-r6-hotfix-source
          path: input
          run-id: 38474797803
          github-token: ${{ github.token }}
      - name: Verify and apply R7 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          test -s input/moksu-r6-hotfix-source.tar.gz
          tar -xzf input/moksu-r6-hotfix-source.tar.gz -C source
          cd source
          git apply --check ../config/moksu/r7/moksu-v3.3.1-R7.patch
          git apply ../config/moksu/r7/moksu-v3.3.1-R7.patch
          node --check userspace/ksud/assets/webadmin/app.js
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('manager/app/src/main')
          for path in ['AndroidManifest.xml','res/drawable/mok_calc_icon.xml','res/drawable/mok_calendar_icon.xml']:
              ET.parse(root/path)
          src=root/'java/me/weishu/kernelsu/mok'
          for name in ['MokCalculatorV7.kt','MokCalendarV7.kt','MokAgendaStore.kt','MokDisplayState.kt']:
              assert (src/name).stat().st_size>500,name
          for key in ['appearance/sync','appearance/disable','appearance']:
              assert key in Path('userspace/ksud/src/webadmin.rs').read_text(), key
          PY
          python3 -m py_compile tools/prepare_r7_variant.py
          cd ..
          cp -a config/moksu source/moksu-build
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=.cxx -czf out/moksu-r7-source.tar.gz -C source .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r7-source
          path: out/
          retention-days: 14
          if-no-files-found: warn

  android:
    name: Build Android R7 unsigned manager
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r7-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r7-source.tar.gz -C source
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile R7 Kotlin, Java and manager resources
        shell: bash
        working-directory: source/manager
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.1-R7 2>&1 | tee "$GITHUB_WORKSPACE/out/gradle-R7.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/moksu-r7-manager-unsigned.apk"
          test -s "$GITHUB_WORKSPACE/out/moksu-r7-manager-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/moksu-r7-manager-unsigned.apk" > "$GITHUB_WORKSPACE/out/unsigned-R7.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r7-android
          path: out/
          retention-days: 14
          if-no-files-found: warn

  rust:
    name: Build R7 ksud Rust daemon
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r7-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r7-source.tar.gz -C source
      - uses: actions/download-artifact@v4
        with:
          pattern: moksu-redesign-kmi-*
          path: lkms
          merge-multiple: true
          run-id: 38418012975
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - name: Rust + Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update && sudo apt-get install -y libclang-dev
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Compile and package two R7 ksud architectures
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash config/moksu/ksu331/build_userspace.sh 2>&1 | tee out/rust-R7.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r7-native
          path: out/
          retention-days: 14
          if-no-files-found: warn
