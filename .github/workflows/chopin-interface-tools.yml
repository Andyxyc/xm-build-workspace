name: Chopin read-only typed interface probe
on:
  push:
    branches: [chopin-feature-kernel-20261025]
    paths: ['chopin/tools/ksu_interface_readonly.c', '.github/workflows/chopin-interface-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 userspace compiler
        run: |
          sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build actual read-only ABI probe
        run: |
          git init sukisu
          git -C sukisu remote add origin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          git -C sukisu fetch --depth=1 origin ce75122bec7423e0f1fa06e3e9a174085c5231ab
          git -C sukisu checkout --detach FETCH_HEAD
          test "$(git -C sukisu rev-parse HEAD)" = ce75122bec7423e0f1fa06e3e9a174085c5231ab
          mkdir tools-out
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -Werror -Isukisu/kernel/include chopin/tools/ksu_interface_readonly.c -o tools-out/ksu_interface_readonly
          aarch64-linux-gnu-readelf -h tools-out/ksu_interface_readonly > tools-out/ELF-header.txt
          cp chopin/tools/ksu_interface_readonly.c chopin/susfs_typed_abi.h tools-out/
          sha256sum tools-out/* > tools-out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chopin-readonly-interface-probe
          path: tools-out/*
          if-no-files-found: error
          retention-days: 14
