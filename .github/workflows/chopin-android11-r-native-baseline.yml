name: Chopin Android11 native R ABI baseline
on:
  push:
    branches: [chopin-feature-kernel-20261025]
    paths:
      - '.github/workflows/chopin-android11-r-native-baseline.yml'
      - 'chopin/tools/a11_r_baseline/**'
      - 'chopin/abi-profiles/android11-three-module-imports.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace_r
      ENABLE_GCC_ARM64: 'true'
      ENABLE_GCC_ARM32: 'true'
      AOSP_GCC_TAG: android-12.1.0_r27
      PYTHONDONTWRITEBYTECODE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache-r
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: |
          set -euo pipefail
          mkdir -p r-baseline-evidence "$WORKSPACE"
          sudo timeout 180 apt-get update -qq
          sudo timeout 180 apt-get install -y --no-install-recommends ccache bc bison flex libssl-dev libelf-dev xz-utils
      - uses: actions/cache/restore@v4
        with:
          path: .ccache-r
          key: chopin-R-clang13-explicit-void-${{ github.run_id }}
          restore-keys: chopin-R-clang13-explicit-void-
      - name: Fetch the exact public R kernel and existing builder utilities
        run: |
          set -euo pipefail
          git init "$WORKSPACE/android-kernel"
          git -C "$WORKSPACE/android-kernel" remote add origin https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
          git -C "$WORKSPACE/android-kernel" fetch --depth=1 origin 2af31af37e12a338fddca780044f8b182c23ed9a
          git -C "$WORKSPACE/android-kernel" checkout --detach FETCH_HEAD
          test "$(git -C "$WORKSPACE/android-kernel" rev-parse HEAD)" = 2af31af37e12a338fddca780044f8b182c23ed9a
          git init builder
          git -C builder remote add origin https://github.com/Owen0225/sukisu-Ultra-4.14.-.git
          git -C builder fetch --depth=1 origin 3a0956434309958a96ca3f701cad7d7c5af0a83b
          git -C builder checkout --detach FETCH_HEAD
          test "$(git -C builder rev-parse HEAD)" = 3a0956434309958a96ca3f701cad7d7c5af0a83b
      - name: Use the existing pinned clang13 investigation toolchain
        run: |
          set -euo pipefail
          git init "$WORKSPACE/clang"
          git -C "$WORKSPACE/clang" remote add origin https://gitlab.com/LeCmnGend/proton-clang.git
          git -C "$WORKSPACE/clang" fetch --depth=1 origin b62936c20dfd8fabd680b8879e2aa0a3cc1b024a
          git -C "$WORKSPACE/clang" checkout --detach FETCH_HEAD
          test "$(git -C "$WORKSPACE/clang" rev-parse HEAD)" = b62936c20dfd8fabd680b8879e2aa0a3cc1b024a
          cd builder
          source scripts/toolchain.sh
          setup_gcc
      - name: Build actual R Image and modules with recorded prototype fix and compare the 434 known R imports
        run: python3 chopin/tools/a11_r_baseline/build_native_r.py
      - name: Preserve exact source changes, including failure cases
        if: always()
        run: |
          mkdir -p r-baseline-evidence
          if test -d "$WORKSPACE/android-kernel/.git"; then
            git -C "$WORKSPACE/android-kernel" diff --binary > r-baseline-evidence/native-source-changes.patch
            git -C "$WORKSPACE/android-kernel" status --short > r-baseline-evidence/native-source-status.txt
          fi
          cp chopin/abi-profiles/android11-three-module-imports.json r-baseline-evidence/
          ccache -s > r-baseline-evidence/ccache.txt || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache-r
          key: chopin-R-clang13-explicit-void-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chopin-android11-R-native-baseline-not-flashable
          path: r-baseline-evidence/**
          if-no-files-found: error
          retention-days: 14
