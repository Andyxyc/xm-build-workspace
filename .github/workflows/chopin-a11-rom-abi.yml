name: Chopin Android11 bounded official boot ABI evidence
on:
  push:
    branches: [chopin-feature-kernel-20261025]
    paths: ['chopin/tools/a11_rom_abi.py', 'chopin/tools/arm64_export_crc.py', '.github/workflows/chopin-a11-rom-abi.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  abi:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: chopin-miui13-a12-ci41100-raw-candidate
          run-id: 40864794871
          github-token: ${{ github.token }}
          path: a11-reference
      - name: Prepare pinned existing symbol parser
        run: |
          git clone https://github.com/marin-m/vmlinux-to-elf.git parser
          git -C parser checkout --detach 29eac31a38db48b51c0dc6aae3be0162237601eb
          test "$(git -C parser rev-parse HEAD)" = 29eac31a38db48b51c0dc6aae3be0162237601eb
          python -m pip install ./parser
      - name: Extract bounded boot and compare current legacy exports
        run: python -B chopin/tools/a11_rom_abi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chopin-a11-current-legacy-abi-evidence
          path: a11-rom-analysis/*.json
          if-no-files-found: error
          retention-days: 14
