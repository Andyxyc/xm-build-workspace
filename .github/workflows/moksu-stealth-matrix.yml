name: moksu 7SU stealth all 8 KMI
on:
  push:
    branches: [moksu-331-restore-7su-20261013]
    paths:
      - '.github/workflows/moksu-stealth-matrix.yml'
permissions:
  contents: read
concurrency:
  group: moksu-stealth-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    name: KernelSU 3.3.1+7SU stealth ${{ matrix.kmi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android14-6.1, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: hartgerinktarcila-design/7kimisu
          ref: 0246ca0f16ea2e3a6af030643bb6f74262e0e26c
          path: old
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Apply 3.3.1 dedicated signing trust and original 7SU stealth core
        shell: bash
        run: |
          set -euo pipefail
          python3 config/moksu/ksu331/apply_release.py source source config
          python3 config/moksu/features/port_stealth.py source old
          grep -q 'KSU_PACKAGE_NAME ?= com.moksu.manager' source/kernel/Kbuild
          grep -q 'df131f3197ed55a19d7e0a86a2b04635a5c0e5ea4bf9b596fef5a8e1d5bbcbd8' source/kernel/Kbuild
          grep -q 'kernelsu-objs += manager/stealth.o' source/kernel/Kbuild
      - name: Build per-arch kernel module with physical stealth functionality
        shell: bash
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          set -euo pipefail
          if [[ "$KMI" == android16-6.12 ]]; then
            bash config/moksu/ksu331/build_lkm16.sh 2>&1 | tee /tmp/stealth-build.log
          else
            bash config/moksu/ksu331/build_lkm.sh 2>&1 | tee /tmp/stealth-build.log
          fi
          mkdir -p out
          cp /tmp/stealth-build.log out/build.log
          for arch in aarch64 x86_64; do
            mod="out/$arch/${KMI}_kernelsu.ko"
            test -s "$mod"
            grep -aq 'ksu_stealth_is_enabled' "$mod" || (echo "Missing compiled stealth symbol in $mod"; exit 1)
            sha256sum "$mod"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-stealth-${{ matrix.kmi }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
