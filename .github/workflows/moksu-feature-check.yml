name: Moksu 7SU feature restoration smoke tests
on:
  push:
    branches: [moksu-331-restore-7su-20261013]
    paths:
      - '.github/workflows/moksu-feature-check.yml'
      - 'moksu/features/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-feature-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android restored extras UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: hartgerinktarcila-design/7kimisu
          ref: 0246ca0f16ea2e3a6af030643bb6f74262e0e26c
          path: old
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Apply original moksu authentication and UI extensions
        run: |
          set -euo pipefail
          python3 -m py_compile config/moksu/features/port_android.py config/moksu/features/port_web.py
          python3 config/moksu/ksu331/apply_release.py source source config
          python3 config/moksu/features/port_stealth.py source old
          python3 config/moksu/features/port_android.py source old
          python3 config/moksu/features/port_web.py source old
          mkdir -p out
          tar --exclude=.git --exclude=.gradle --exclude=target --exclude=build -czf out/moksu331-restored-source.tar.gz -C source .
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 16111833
          log-accepted-android-sdk-licenses: false
      - name: Android SDK and NDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile UI
        shell: bash
        working-directory: source/manager
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.1 2>&1 | tee "$GITHUB_WORKSPACE/out/moksu-feature-android.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/moksu-feature-staging.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-7su-android-test
          path: out/
          if-no-files-found: error
          retention-days: 14
  native:
    name: Restore original 7SU webadmin in real ksud
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: hartgerinktarcila-design/7kimisu
          ref: 0246ca0f16ea2e3a6af030643bb6f74262e0e26c
          path: old
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Patch and verify full web server
        run: |
          set -euo pipefail
          python3 config/moksu/ksu331/apply_release.py source source config
          python3 config/moksu/features/port_stealth.py source old
          python3 config/moksu/features/port_web.py source old
          mkdir -p out
          python3 - <<'PY'
          from pathlib import Path
          p=Path("source/userspace/ksud/assets/webadmin")
          assert '<h1>moksu</h1>' in (p/"index.html").read_text()
          assert '心中都是莫' in (p/"index.html").read_text()
          import json
          data={"web_port_localhost_only":True,"access_token_bits":256,
                "copy_source":"7kimisu v2.29","native_source":"official KernelSU 3.3.1"}
          Path("out/web-integrity.json").write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: moksu331-lkm-*
          path: lkms
          merge-multiple: true
          run-id: 38399859940
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: moksu331-fixed-lkm-android16-6.12
          path: lkms
          run-id: 38401019211
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 16111833
          log-accepted-android-sdk-licenses: false
      - name: Prepare actual Android native targets
        run: |
          set -euo pipefail
          sdkmanager 'ndk;29.0.14206865'
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup update stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build 7SU webadmin-backed 3.3.1 ksud
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          mkdir -p out
          bash config/moksu/ksu331/build_userspace.sh 2>&1 | tee out/moksu-web-rust.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-7su-native-test
          path: out/
          if-no-files-found: error
          retention-days: 14
