name: moksu R7 independent recovery Android hotfix
on:
  push:
    branches: [moksu-331-r7-hotfix-20261014]
    paths:
      - 'moksu/r7/presentation-recovery-hotfix.patch'
      - '.github/workflows/moksu-r7-hotfix-android.yml'
      - 'moksu/r7/compose-setter-hotfix.patch'
permissions:
  contents: read
  actions: read
concurrency:
  group: moksu-r7-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Apply recovery hotfix to R7 source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {path: config, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moksu-r7-source
          path: input
          run-id: 38479188775
          github-token: ${{ github.token }}
      - name: Verify independent presentation recovery patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -xzf input/moksu-r7-source.tar.gz -C source
          cd source
          git apply --check ../config/moksu/r7/presentation-recovery-hotfix.patch
          git apply ../config/moksu/r7/presentation-recovery-hotfix.patch
          git apply --check ../config/moksu/r7/compose-setter-hotfix.patch
          git apply ../config/moksu/r7/compose-setter-hotfix.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('manager/app/src/main/java/me/weishu/kernelsu/mok/MokDisguise.kt').read_text()
          assert 'val presentationRestored = MokDisplayState.setUninstalled' in p
          assert 'if (state != 1) Pair(state, state == 0)' in p
          extras=Path('manager/app/src/main/java/me/weishu/kernelsu/mok/MoksuExtrasActivity.kt').read_text()
          assert 'private fun toggleUninstalledDisplay(value: Boolean)' in extras
          assert 'private fun setUninstalledDisplay(value: Boolean)' not in extras
          PY
          cd ..
          tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=.cxx -czf out/moksu-r7-recovery-source.tar.gz -C source .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r7-recovery-source
          path: out/
          retention-days: 14
          if-no-files-found: warn
  android:
    name: Build R7 Android with independent recovery
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: {name: moksu-r7-recovery-source, path: input}
      - run: mkdir -p out && tar -xzf input/moksu-r7-recovery-source.tar.gz -C source
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, cmdline-tools-version: 16111833, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Compile signed-ready R7 UI with correct recovery
        shell: bash
        working-directory: source/manager
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PKSU_NAME=moksu -PKSU_PACKAGE_NAME=com.moksu.manager -PKSU_VERSION_NAME=3.3.1-R7 2>&1 | tee "$GITHUB_WORKSPACE/out/gradle-R7-recovery.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/moksu-r7-manager-unsigned-recovery.apk"
          test -s "$GITHUB_WORKSPACE/out/moksu-r7-manager-unsigned-recovery.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moksu-r7-android-recovery
          path: out/
          retention-days: 14
          if-no-files-found: warn
